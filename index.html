const NET={on:false,ws:null,status:'off',id:null,rooms:[],room:null,chat:[],quick:[],start:null,role:null,mySlot:-1,inputs:{},snapT:0,inT:0,newPops:[],ping:0,prepReady:[],queued:false,err:null,cnt:{b:0,c:0,dash:0},lastSnap:null};
const DEFAULT_SERVER='wss://duel-legends-arena.onrender.com';
// ?server= só vale para servidor local (testes): um link com servidor de fora poderia capturar login e senha
function serverUrl(){try{const q=new URLSearchParams(location.search).get('server');if(q&&/^wss?:\/\/(localhost|127\.0\.0\.1|\[::1\])(:\d+)?(\/|$)/i.test(q))return q;}catch(e){}return (save.opt&&save.opt.server)||DEFAULT_SERVER;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function withSeed(seed,fn){const r=Math.random;Math.random=mulberry32(seed);try{return fn();}finally{Math.random=r;}}
function netSend(o){if(NET.ws&&NET.ws.readyState===1)NET.ws.send(JSON.stringify(o));}
function netConnect(){if(NET.ws&&(NET.ws.readyState===0||NET.ws.readyState===1))return;NET.status='connecting';NET.err=null;
 let ws;try{ws=new WebSocket(serverUrl());}catch(e){NET.status='error';NET.err='Endereço do servidor inválido';return;}NET.ws=ws;
 ws.onopen=()=>{NET.status='on';netSend(helloMsg(save.nick||'Jogador'));NET.pingT=setInterval(()=>netSend({t:'ping',ts:performance.now()}),3000);};
 ws.onclose=()=>{clearInterval(NET.pingT);NET.ready=false;const wasFight=NET.on&&(state==='fight'||state==='countdown'||state==='prep'||state==='draw');NET.status=NET.status==='connecting'?'error':'off';NET.ws=null;NET.room=null;
  if(NET.status==='error')NET.err='Não foi possível conectar. O servidor pode estar acordando (até 1 minuto): tente de novo.';if(wasFight){netAbort('Conexão perdida.');}};
 ws.onerror=()=>{};ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}netMsg(m);};}

// filtro de nomes: bloqueia palavrões, ofensas e termos de ódio (português e inglês)
// normaliza acentos, números no lugar de letras (4=a, 3=e, 1=i, 0=o, 5=s, 7=t, @=a, $=s) e letras repetidas
const BAD_ROOTS = ['porra', 'caralh', 'karalh', 'buceta', 'bucet', 'xoxota', 'xereca', 'xota', 'puta', 'puto', 'putinha', 'viado', 'viadinh', 'bixa', 'bicha',
  'vagabund', 'arrombad', 'cuzao', 'cusao', 'cuzinh', 'fdp', 'filhodaput', 'foder', 'fodase', 'fodas', 'fodid', 'merd', 'bosta', 'bostinh', 'porrinh', 'caralinh', 'cuzinho', 'piroca', 'pirok', 'rola',
  'punheta', 'siririca', 'boquete', 'chupaminha', 'pauno', 'paunocu', 'corno', 'otario', 'babaca', 'retardad', 'mongoloid', 'estupr', 'pedofil', 'nazi', 'hitler',
  'crioulo', 'fuck', 'fuk', 'shit', 'bitch', 'cunt', 'dick', 'pussy', 'whore', 'slut', 'nigg', 'nigga', 'faggot', 'retard', 'sexo', 'porn', 'xvideo', 'peitud', 'gostos'];
// palavras normais que contêm um trecho acima e não devem ser bloqueadas
const OK_WORDS = ['computa', 'disputa', 'reputa', 'imputa', 'deputad', 'amputa', 'putamen', 'rolamento', 'rolando', 'rolagem', 'controla', 'escola', 'carola', 'crola',
  'marola', 'corola', 'pirola', 'patrola', 'petrola', 'pintor', 'pintura', 'pintado', 'pintassilgo', 'shitake', 'dickens', 'bichano', 'sexton',
  'consexo', 'sussex', 'essex', 'scunthorpe', 'pintinho', 'rolao', 'rolinha', 'otaku', 'diaspora', 'espora', 'merdeka'];
function normName(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[4@]/g, 'a').replace(/3/g, 'e').replace(/[1!|]/g, 'i').replace(/0/g, 'o').replace(/[5$]/g, 's').replace(/7/g, 't')
    .replace(/[^a-z]/g, '').replace(/(.)\1+/g, '$1');
}
function badName(s) {
  let n = normName(s);
  for (const w of OK_WORDS) n = n.split(normName(w)).join('#');
  return BAD_ROOTS.some(r => n.includes(normName(r)));
}

 case 'welcome':NET.id=m.id;NET.quick=m.quick||[];if(m.now)NET.tOff=m.now-Date.now();break;

const TIERS=[{n:'Ferro',col:'#8a7d77'},{n:'Bronze',col:'#b9773f'},{n:'Prata',col:'#b4c3d3'},{n:'Ouro',col:'#efbf4f'},{n:'Platina',col:'#4fc6b2'},{n:'Esmeralda',col:'#2fcf74'},{n:'Diamante',col:'#7fb0ff'},{n:'Mestre',col:'#bc84ff'},{n:'Grão-Mestre',col:'#ff5a64'},{n:'Desafiante',col:'#ffdc72'}];
const ROMAN=['IV','III','II','I'];
function rankInit(){const r=save.rank;if(!r||r.tier==null)save.rank={tier:-1,div:0,lp:0,mmr:1150,placed:0,w:0,l:0,shield:0,streak:0,peak:-1,peakName:'',season:1,split:1};}
function apexOf(r){return r.tier<7?r.tier:r.lp>=500?9:r.lp>=200?8:7;}
function rankName(r){if(r.tier<0)return 'Sem elo';const t=apexOf(r);return t>=7?TIERS[t].n:`${TIERS[t].n} ${ROMAN[r.div]}`;}
function rankCol(r){return r.tier<0?'#9aa3c7':TIERS[apexOf(r)].col;}
function rankScore(r){return r.tier>=7?2800+r.lp:r.tier*400+r.div*100+r.lp;}
function fromScore(sc){sc=Math.max(0,sc);if(sc>=2800)return{tier:7,div:0,lp:0};return{tier:Math.floor(sc/400),div:Math.floor((sc%400)/100),lp:0};}
function rankLabel(r){if(r.tier<0)return r.placed>0?`Colocação ${r.placed}/5`:'Sem elo';return `${rankName(r)} · ${r.lp} PDL`;}
function rankedResult(win){const r=save.rank;const opp=r.oppMmr||r.mmr;const exp=1/(1+Math.pow(10,(opp-r.mmr)/400));r.mmr=Math.round(r.mmr+(r.placed<5?60:28)*((win?1:0)-exp));
 if(win)r.w++;else r.l++;r.streak=win?Math.max(1,r.streak+1):Math.min(-1,r.streak-1);const out={win,d:0};
 if(r.placed<5){r.placed++;out.placement=r.placed;if(r.placed===5){const f=fromScore(r.mmr-400-60);r.tier=f.tier;r.div=f.div;r.lp=f.tier>=7?0:Math.round(rnd(10,40));out.placedNow=rankName(r);r.shield=3;out.box=true;}}
 else{const gap=(r.mmr-400-rankScore(r))/20;const shieldWas=r.shield;r.shield=Math.max(0,r.shield-1);
  if(win){out.d=Math.round(clamp(21+gap+(r.streak>=3?3:0),14,34));r.lp+=out.d;
   if(r.tier<7)while(r.lp>=100){r.lp-=100;if(r.div<3){r.div++;out.promo=rankName(r);}else{r.tier++;r.div=0;r.shield=3;out.promo=rankName(r);out.tierUp=true;r.boxT=r.boxT||[];if(!r.boxT.includes(r.tier)){r.boxT.push(r.tier);out.box=true;}if(r.tier>=7){r.lp=0;break;}}}}
  else{out.d=-Math.round(clamp(18-gap,10,28));
   if(r.tier>=7){r.lp+=out.d;if(r.lp<0){if(shieldWas>0){r.lp=0;out.shield=true;}else{r.tier=6;r.div=3;r.lp=75;out.demo=rankName(r);}}}
   else if(r.lp>0)r.lp=Math.max(0,r.lp+out.d);
   else if(r.div>0){r.div--;r.lp=75;out.demo=rankName(r);}
   else if(r.tier>0){if(shieldWas>0){out.shield=true;}else{r.tier--;r.div=3;r.lp=75;out.demo=rankName(r);}}}}
 if(out.box)save.boxes=(save.boxes||0)+1;
 if(r.tier>=0&&rankScore(r)>r.peak){r.peak=rankScore(r);r.peakName=rankName(r);}
 out.after=rankLabel(r);out.col=rankCol(r);return out;}

function doB(f){if(f.blocking||f.cdB>0||f.stun>0||f.dashT>0||f.channel)return;tutEv(f,'b');f.revealT=Math.max(f.revealT||0,0.6);if(f.def.hand)POW[f.def.id].b(f);else{genB(f,f.def.kit.B);f.cdB=5;announce(f,1);}}

function doDash(f,ang){if(f.cdDash>0||f.stun>0||f.dashT>0||f.channel)return;tutEv(f,'dash');f.blocking=false;const inv=0.2+(f.st.esq>=100?0.05:0);const dd=f.def.melee?BAL.meleeDash[0]:60;f.dashT=0.2;f.dvx=Math.cos(ang)*dd/0.2;f.dvy=Math.sin(ang)*dd/0.2;f.inv=inv;f.dodged=false;if(f===G.p&&save.cos.eq.trail){const c=cosFind(save.cos.eq.trail);for(let k=0;k<10;k++)G.parts.push({x:f.x+rnd(-4,4),y:f.y-8+rnd(-6,6),vx:-Math.cos(ang)*rnd(20,60),vy:-Math.sin(ang)*rnd(20,60),life:0.5,t:0,col:cosColor(c.col,time+k*0.1),sz:2});}f.cdDash=f.dashCd*(f.def.melee?BAL.meleeDash[1]:1);f.dashAtk=null;sfx('dash');}

function botThink(f,dt){const t=f.foe,ai=f.ai;
 if(f.blind&&t){if(ai.lx==null||Math.hypot(ai.lx-f.x,ai.ly-f.y)<20){const z=G.zone;ai.lx=rnd(z.x1+40,z.x2-40);ai.ly=rnd(z.y1+40,z.y2-40);}
  const a=Math.atan2(ai.ly-f.y,ai.lx-f.x);f.mv={x:Math.cos(a)*0.8,y:Math.sin(a)*0.8};f.aim=a;f.blocking=false;return;}
 if(t){ai.lx=t.x+rnd(-20,20);ai.ly=t.y+rnd(-20,20);}
 ai.blockT=Math.max(0,(ai.blockT||0)-dt);if(f.blocking&&ai.blockT<=0)f.blocking=false;
 if(!f.blocking&&!(f.broken>0)&&f.guard>f.guardMax*0.35&&f.dashT<=0&&!f.channel){let threat=false,close=false;
  for(const p of G.proj){if(p.owner===f)continue;const rx=f.x-p.x,ry=f.y-8-p.y,pd=Math.hypot(rx,ry),sp=Math.hypot(p.vx,p.vy);if(pd<90&&(rx*p.vx+ry*p.vy)/(pd*sp)>0.85){threat=true;if(pd<22)close=true;}}
  const md=Math.hypot(t.x-f.x,t.y-f.y);if(t.def.melee&&md<34&&t.cdA>0.3)threat=true;
  if(threat&&(f.cdDash>0||Math.random()<0.5)&&Math.random()<(close?0.04:0.025)){f.blocking=true;f.blockStart=close?time:time-0.3;ai.blockT=rnd(0.35,0.8);}}
 if(f.blocking){const d0=Math.hypot(t.x-f.x,t.y-f.y)||1;f.aim=Math.atan2(t.y-f.y,t.x-f.x);f.mv={x:-(t.x-f.x)/d0*0.3,y:-(t.y-f.y)/d0*0.3};return;}const dx=t.x-f.x,dy=t.y-f.y,d=Math.hypot(dx,dy);const ang=Math.atan2(dy,dx);
 // mira com antecipação
 const lead=f.def.melee?0:clamp(d/220,0,0.6);f.aim=Math.atan2(t.y+t.vy*lead*0.5-f.y,t.x+t.vx*lead*0.5-f.x);
 const dc=G.decoys.find(q=>q.owner===t&&q.t>1);if(dc)f.aim=Math.atan2(dc.y-f.y,dc.x-f.x);
 ai.strafeT-=dt;if(ai.strafeT<=0){ai.strafe=Math.random()<0.5?-1:1;ai.strafeT=rnd(0.8,2);}
 const kite=!f.def.melee&&window.__kite!==false;const pref=f.def.melee?18:f.def.range*(kite?0.95:0.75);let mx=0,my=0;
 if(kite&&t.def.melee&&d<90){mx-=Math.cos(ang)*1.6;my-=Math.sin(ang)*1.6;if(d<50&&f.cdDash<=0&&Math.random()<0.2)doDash(f,ang+Math.PI+rnd(-0.6,0.6));}
 if(d>pref+15){mx+=Math.cos(ang);my+=Math.sin(ang);}else if(d<pref-15){mx-=Math.cos(ang);my-=Math.sin(ang);}
 mx+=Math.cos(ang+Math.PI/2)*ai.strafe*0.7;my+=Math.sin(ang+Math.PI/2)*ai.strafe*0.7;
 // ficar dentro da zona
 const z=G.zone,cx=(z.x1+z.x2)/2,cy=(z.y1+z.y2)/2;if(f.x<z.x1+24||f.x>z.x2-24||f.y<z.y1+24||f.y>z.y2-24){const a=Math.atan2(cy-f.y,cx-f.x);mx+=Math.cos(a)*1.5;my+=Math.sin(a)*1.5;}
 // evitar perigos
 const nx=f.x+mx*20,ny=f.y+my*20;const look={x:nx,y:ny};
 if(G.hz.lava.some(r=>inRect(look,{x:r.x-8,y:r.y-8,w:r.w+16,h:r.h+16}))||G.hz.beam.some(b=>beamState(b)!=='off'&&Math.abs(nx-(b.x+b.w/2))<b.w/2+8)){mx=-mx+Math.cos(ang+Math.PI/2)*ai.strafe;my=-my+Math.sin(ang+Math.PI/2)*ai.strafe;}
 const l=Math.hypot(mx,my)||1;f.mv={x:mx/l,y:my/l};
 // desviar de projéteis
 for(const p of G.proj){if(p.owner===f)continue;const rx=f.x-p.x,ry=f.y-8-p.y;const pd=Math.hypot(rx,ry);if(pd<70){const sp=Math.hypot(p.vx,p.vy);const dot=(rx*p.vx+ry*p.vy)/(pd*sp);if(dot>0.85&&f.cdDash<=0&&Math.random()<0.035){const pa=Math.atan2(p.vy,p.vx)+(Math.random()<0.5?1:-1)*Math.PI/2;doDash(f,pa);break;}}}
 for(const zn of G.zones){if(zn.owner!==f&&zn.t<zn.delay&&Math.hypot(f.x-zn.x,f.y-zn.y)<zn.r+6&&f.cdDash<=0&&Math.random()<0.06)doDash(f,Math.atan2(f.y-zn.y,f.x-zn.x));}
 if(f.def.melee&&d>70&&f.cdDash<=0&&Math.random()<BAL.gapDash)doDash(f,ang);
 ai.react-=dt;if(ai.react>0)return;ai.react=rnd(0.18,0.38)*BAL.react/(G.diff||1);
 const inRange=d<(f.def.melee?f.def.range+10:f.def.range+30);
 if(inRange&&Math.random()<Math.min(0.9,0.65*(G.diff||1)))doA(f);
 ai.thinkB-=0.15;if(f.cdB<=0&&ai.thinkB<=0&&d<(f.def.melee?120:200)){doB(f);ai.thinkB=rnd(1,3);}
 if(f.charge>=100&&(d<(f.def.melee?70:220))&&Math.random()<0.5)doC(f);
 if(f.def.melee&&d<40&&f.cdDash<=0&&t.channel&&Math.random()<0.1)doDash(f,ang+Math.PI);
}
function autoAim(f){const t=f.foe;const d=Math.hypot(t.x-f.x,t.y-f.y);const lead=f.def.melee?0:clamp(d/250,0,0.5);return Math.atan2(t.y+t.vy*lead*0.4-f.y,t.x+t.vx*lead*0.4-f.x);}

function updateFighter(f,dt){
 f.cdA=Math.max(0,f.cdA-dt*BAL.atkRate);f.cdB=Math.max(0,f.cdB-dt*BAL.bRate);f.cdDash=Math.max(0,f.cdDash-dt);f.inv=Math.max(0,f.inv-dt);f.flash=Math.max(0,f.flash-dt);f.squash=Math.max(0,(f.squash||0)-dt);if(f.windT>0){f.windT-=dt;if(f.windT<=0){f.windT=0;fireC(f);}}f.stun=Math.max(0,f.stun-dt);f.freeze=Math.max(0,f.freeze-dt);
 f.slowT=Math.max(0,f.slowT-dt);if(f.slowT<=0)f.slowF=1;
 for(const k of ['shieldT','ghost','power','marked','reflect','big'])if(f[k]>0)f[k]=Math.max(0,f[k]-dt);
 if(f.broken>0){f.broken-=dt;if(f.broken<=0)f.guard=f.guardMax*0.5;}
 f.guardRegen=Math.max(0,f.guardRegen-dt);if(!f.blocking&&f.guardRegen<=0&&!(f.broken>0))f.guard=Math.min(f.guardMax,f.guard+f.guardMax*0.3*dt);f.drain=Math.max(0,f.drain-dt);f.haste=Math.max(0,f.haste-dt);f.tpCd=Math.max(0,f.tpCd-dt);f.spin=Math.max(0,(f.spin||0)-dt);
 if(!G.over)f.charge=Math.min(100,f.charge+f.st.esp/30*dt*BAL.chargeRate*cbk(f));
 let mv={x:0,y:0};
 if(f.remote){mv=netRemoteInput(f);}
 else if(!f.bot){
  if(keys.KeyW||keys.ArrowUp)mv.y-=1;if(keys.KeyS||keys.ArrowDown)mv.y+=1;if(keys.KeyA||keys.ArrowLeft)mv.x-=1;if(keys.KeyD||keys.ArrowRight)mv.x+=1;
  if(touch.joy!=null){mv.x=touch.joyV.x;mv.y=touch.joyV.y;}
  const l=Math.hypot(mv.x,mv.y);if(l>1){mv.x/=l;mv.y/=l;}
  f.aim=isTouch?autoAim(f):Math.atan2(mouse.y+G.cam.y-(f.y-8),mouse.x+G.cam.x-f.x);
  const wantBlock=!G.over&&f.stun<=0&&f.dashT<=0&&!f.channel&&!(f.broken>0)&&(keys.ShiftLeft||keys.ShiftRight||mouse.right||touch.blk!=null);
